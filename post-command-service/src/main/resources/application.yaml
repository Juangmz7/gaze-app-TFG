# Keys that decide which beans exist live here, not only in a profile: the native
# image evaluates those conditions once, at build time with no profile, and the
# same image runs with dev and prod. The defaults are the dev values; prod
# overrides them from its environment.

# --- Application identity (also the default OpenTelemetry service.name) ---
spring:
  application:
    name: post-command-service
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
  # --- OAuth2 Resource Server (downloads the Keycloak JWKS to validate tokens) ---
  # Both are set so the image always builds the JWK-set decoder: the clusters give the
  # public issuer (checked against each token's "iss") plus Keycloak's in-cluster JWKS URL,
  # since the public host is not reachable from the pods.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/auth-service}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/auth-service/protocol/openid-connect/certs}
  # --- RabbitMQ publisher confirms (required by the outbox relay) ---
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    # Bounds each connection attempt (default 60 s): keeps relay cycles and the
    # immediate send on the HTTP thread short, well under the outbox lock timeout.
    connection-timeout: 5s

# --- Outbox relay ---
outbox:
  relay:
    fixed-delay-ms: 40000
  cleanup:
    cron: "0 0 3 * * *"

# --- Post media business rules (shared across tasks 32/35/38/39) ---
posts:
  media:
    upload-window: PT48H
    max-image-bytes: 10485760
    max-video-bytes: 209715200
  # --- Scheduled cleanup of expired uploads (task 58) ---
  # Hourly at minute 15, away from the top of the hour. lock-at-most-for must stay
  # shorter than the interval; each run handles at most batch-size * max-batches-per-run posts.
  media-cleanup:
    cron: "0 15 * * * *"
    lock-at-most-for: PT55M
    lock-at-least-for: PT5M
    batch-size: 200
    max-batches-per-run: 10
  # --- Scheduled purge of failed posts (task 60) ---
  # Hourly at minute 45 (30 minutes after the media cleanup). Hard-deletes MEDIA_UPLOAD_FAILED
  # posts whose blobs were purged more than `retention` ago; each run handles at most
  # batch-size * max-batches-per-run posts.
  failed-purge:
    cron: "0 45 * * * *"
    retention: P7D
    lock-at-most-for: PT55M
    lock-at-least-for: PT5M
    batch-size: 200
    max-batches-per-run: 10

# --- RabbitMQ Bindings ---
rabbitmq:
  queue:
    post: q.post-command-service.post
    post-media: q.post-command-service.post.media
    user:
      slow: q.post-command-service.user.slow
      fast: q.post-command-service.user.fast

  exchange:
    post:
      commands: x.post.commands
      events: x.post.events
    user:
      events: x.user.events

  rk:
    post:
      # --- post ---
      created: rk.post.created
      updated: rk.post.updated
      deleted: rk.post.deleted
      banned: rk.post.banned
      viewed: rk.post.viewed

      # --- media ---
      media:
        uploaded: rk.post.media.uploaded
        validation:
          succeeded: rk.post.media.validation.succeeded
          failed: rk.post.media.validation.failed

      # --- view ---
      view:
        process: rk.post.view.process

      # --- like ---
      like:
        validate: rk.post.like.validate
        created: rk.post.like.created
        deleted: rk.post.like.deleted
      unlike:
        validate: rk.post.unlike.validate

      # --- share ---
      share:
        create:
          validate: rk.post.share.create.validate
        delete:
          validate: rk.post.share.delete.validate
        created: rk.post.share.created
        deleted: rk.post.share.deleted

      # --- comment ---
      comment:
        created: rk.post.comment.created
        updated: rk.post.comment.updated
        deleted: rk.post.comment.deleted
        banned: rk.post.comment.banned
        like:
          validate: rk.post.comment.like.validate
          created: rk.post.comment.like.created
          deleted: rk.post.comment.like.deleted

      # --- collab ---
      collab:
        opened:
          post-created: rk.post.collab.opened.post-created
          existing-post: rk.post.collab.opened.existing-post
        closed: rk.post.collab.closed
        deleted: rk.post.collab.deleted
        linked: rk.post.collab.linked
        request:
          created: rk.post.collab.request.created
          accepted: rk.post.collab.request.accepted
          declined: rk.post.collab.request.declined
          deleted: rk.post.collab.request.deleted
        member:
          left: rk.post.collab.member.left
          banned: rk.post.collab.member.banned
        join-instructions:
          updated: rk.post.collab.join-instructions.updated

    # --- user ---
    user:
      deleted: rk.user.deleted
      registered: rk.user.registered
      updated: rk.user.updated
      follow:
        created: rk.user.follow.created
        deleted: rk.user.follow.deleted
      block:
        created: rk.user.block.created
        deleted: rk.user.block.deleted

# --- Actuator (Kubernetes probes: /actuator/health/liveness and /readiness) ---
management:
  # --- OpenTelemetry (OTLP HTTP export of traces and logs) ---
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  # Histogram buckets, so that Grafana can compute p50/p95/p99. Without them a
  # timer only exports its count and sum. The expected range bounds how many
  # buckets each series gets.
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        hikaricp.connections.acquire: true
        hikaricp.connections.usage: true
        spring.rabbitmq.listener: true
        spring.data.repository.invocations: true
        jvm.gc.pause: true
      minimum-expected-value:
        http.server.requests: 1ms
        hikaricp.connections.acquire: 1ms
        hikaricp.connections.usage: 1ms
        spring.rabbitmq.listener: 1ms
        spring.data.repository.invocations: 1ms
        jvm.gc.pause: 1ms
      maximum-expected-value:
        http.server.requests: 30s
        hikaricp.connections.acquire: 30s
        hikaricp.connections.usage: 60s
        spring.rabbitmq.listener: 120s
        spring.data.repository.invocations: 30s
        jvm.gc.pause: 10s
