# --- Application identity (also the default OpenTelemetry service.name) ---
spring:
  application:
    name: post-command-service
  # --- RabbitMQ publisher confirms (required by the outbox relay) ---
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    # Bounds each connection attempt (default 60 s): keeps relay cycles and the
    # immediate send on the HTTP thread short, well under the outbox lock timeout.
    connection-timeout: 5s

# --- Outbox relay ---
outbox:
  relay:
    fixed-delay-ms: 40000
  cleanup:
    cron: "0 0 3 * * *"

# --- Post media business rules (shared across tasks 32/35/38/39) ---
posts:
  media:
    upload-window: PT48H
    max-image-bytes: 10485760
    max-video-bytes: 209715200

# --- RabbitMQ Bindings ---
rabbitmq:
  queue:
    post: q.post-command-service.post
    post-media: q.post-command-service.post.media
    user:
      slow: q.post-command-service.user.slow
      fast: q.post-command-service.user.fast

  exchange:
    post:
      commands: x.post.commands
      events: x.post.events
    user:
      events: x.user.events

  rk:
    post:
      # --- post ---
      created: rk.post.created
      updated: rk.post.updated
      deleted: rk.post.deleted
      banned: rk.post.banned
      viewed: rk.post.viewed

      # --- media ---
      media:
        uploaded: rk.post.media.uploaded
        validation:
          succeeded: rk.post.media.validation.succeeded
          failed: rk.post.media.validation.failed

      # --- view ---
      view:
        process: rk.post.view.process

      # --- like ---
      like:
        validate: rk.post.like.validate
        created: rk.post.like.created
        deleted: rk.post.like.deleted
      unlike:
        validate: rk.post.unlike.validate

      # --- share ---
      share:
        create:
          validate: rk.post.share.create.validate
        delete:
          validate: rk.post.share.delete.validate
        created: rk.post.share.created
        deleted: rk.post.share.deleted

      # --- comment ---
      comment:
        created: rk.post.comment.created
        updated: rk.post.comment.updated
        deleted: rk.post.comment.deleted
        banned: rk.post.comment.banned
        like:
          validate: rk.post.comment.like.validate
          created: rk.post.comment.like.created
          deleted: rk.post.comment.like.deleted

      # --- collab ---
      collab:
        opened:
          post-created: rk.post.collab.opened.post-created
          existing-post: rk.post.collab.opened.existing-post
        closed: rk.post.collab.closed
        deleted: rk.post.collab.deleted
        linked: rk.post.collab.linked
        request:
          created: rk.post.collab.request.created
          accepted: rk.post.collab.request.accepted
          declined: rk.post.collab.request.declined
          deleted: rk.post.collab.request.deleted
        member:
          left: rk.post.collab.member.left
          banned: rk.post.collab.member.banned

    # --- user ---
    user:
      deleted: rk.user.deleted
      registered: rk.user.registered
      updated: rk.user.updated
      follow:
        created: rk.user.follow.created
        deleted: rk.user.follow.deleted
      block:
        created: rk.user.block.created
        deleted: rk.user.block.deleted

# --- Actuator (Kubernetes probes: /actuator/health/liveness and /readiness) ---
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
