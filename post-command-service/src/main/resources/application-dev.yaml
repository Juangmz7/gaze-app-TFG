# Development Profile — post-command-service
# Activate with: --spring.profiles.active=dev
spring:
  # --- PostgreSQL ---
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5434/post_command_service_db
    username: post_command_user
    password: super_secret_post_command_postgres_password_123
    hikari:
      pool-name: post-command-service-hikari-pool-dev

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true

  # --- RabbitMQ ---
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  # --- Keycloak  ---
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/auth-service

# --- Azure Blob Storage (local Azurite emulator) ---
azure:
  storage:
    account-url: http://127.0.0.1:10000/devstoreaccount1
    container: post-media-dev
    upload-sas-ttl: PT15M
    use-account-key: true
    # Azurite's well-known default emulator key (local emulator only, never a real secret).
    account-key: ${AZURE_STORAGE_ACCOUNT_KEY:Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==}
    allow-http: true

# --- Logging (verbose for debugging) ---
logging:
  level:
    root: INFO
    com.app.postcommandservice: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: TRACE
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.amqp: DEBUG
    io.opentelemetry: DEBUG

# --- OpenTelemetry (local Grafana LGTM stack) ---
management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  tracing:
    sampling:
      probability: 1.0