name: docker publish (reusable)

# Builds one image and pushes it to Docker Hub as :latest and :<commit sha>.
# Called by each service's CI workflow (<service>-ci.yml) after its tests pass
# on main, and by keycloak-image.yml. With e2e-script, the image is first run
# through that end-to-end test and only pushed if it passes (a native image can
# build fine and still fail at run time); with push: false it is only built and
# tested, to check a pull request.
# The Kubernetes manifests (infra/k8s) track :latest; Argo CD Image Updater
# pins the new digest on every push. Requires the DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN repository secrets (token: Docker Hub access token with
# Read & Write scope).

on:
  workflow_call:
    inputs:
      image:
        description: Docker Hub repository
        required: true
        type: string
      context:
        description: Build context, relative to the repository root
        required: true
        type: string
      dockerfile:
        description: Dockerfile path, relative to the repository root
        required: true
        type: string
      build-args:
        description: Docker build arguments, one KEY=VALUE per line
        required: false
        type: string
        default: ""
      e2e-script:
        description: Script, relative to the repository root, run with the built image as its argument before pushing it
        required: false
        type: string
        default: ""
      push:
        description: Push the image (false only builds and tests it)
        required: false
        type: boolean
        default: true
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image for the end-to-end test
        if: inputs.e2e-script != ''
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          load: true
          tags: e2e/${{ inputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}

      - name: End-to-end test of the image
        if: inputs.e2e-script != ''
        env:
          E2E_SCRIPT: ${{ inputs.e2e-script }}
          E2E_IMAGE: e2e/${{ inputs.image }}:${{ github.sha }}
        run: bash "$E2E_SCRIPT" "$E2E_IMAGE"

      - uses: docker/login-action@v3
        if: inputs.push
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # With an end-to-end test this reuses the build above from the cache
      - uses: docker/build-push-action@v6
        if: inputs.push
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          push: true
          tags: |
            docker.io/${{ inputs.image }}:latest
            docker.io/${{ inputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
