name: recommendation-service CI

on:
  pull_request:
    branches: [main]
    paths:
      - "recommendation-service/**"
      - ".github/workflows/recommendation-service-ci.yml"
  push:
    branches-ignore: [main]
    paths:
      - "recommendation-service/**"
      - ".github/workflows/recommendation-service-ci.yml"
  workflow_dispatch: {}

concurrency:
  group: recommendation-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recommendation-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: recommendation-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest
