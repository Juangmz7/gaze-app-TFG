name: social-service CI

on:
  pull_request:
    branches: [main]
    paths:
      - "social-service/**"
      - ".github/workflows/social-service-ci.yml"
  push:
    branches-ignore: [main]
    paths:
      - "social-service/**"
      - ".github/workflows/social-service-ci.yml"
  workflow_dispatch: {}

concurrency:
  group: social-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: social-service
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm
          java-version: "25"
          cache: maven
          cache-dependency-path: social-service/pom.xml

      - name: Run tests
        run: ./mvnw test -Dspring.profiles.active=test --no-transfer-progress
