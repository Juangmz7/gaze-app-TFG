name: post-query-service CI

on:
  pull_request:
    branches: [main]
    paths:
      - "post-query-service/**"
      - "common-packages/go-utils/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/post-query-service-ci.yml"
  push:
    branches-ignore: [main]
    paths:
      - "post-query-service/**"
      - "common-packages/go-utils/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/post-query-service-ci.yml"
  workflow_dispatch: {}

concurrency:
  group: post-query-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: post-query-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: |
            go.work.sum
            post-query-service/go.sum

      - name: Run tests
        run: go test -v ./...
