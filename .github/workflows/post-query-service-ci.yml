name: post-query-service CI

on:
  pull_request:
    branches: [main]
    paths:
      - "post-query-service/**"
      - "common-packages/go-utils/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/post-query-service-ci.yml"
  push:
    paths:
      - "post-query-service/**"
      - "common-packages/go-utils/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/post-query-service-ci.yml"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: post-query-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: post-query-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: |
            go.work.sum
            post-query-service/go.sum

      - name: Run tests
        run: go test -v ./...

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/docker-publish.yml
    with:
      image: juangmz7/post-query-service
      # Repo root: the Go build needs go.work and common-packages/go-utils.
      context: .
      dockerfile: post-query-service/Dockerfile
    secrets: inherit
