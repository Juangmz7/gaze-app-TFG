name: post-command-service CI

on:
  pull_request:
    branches: [main]
    paths:
      - "post-command-service/**"
      - ".github/workflows/post-command-service-ci.yml"
  push:
    paths:
      - "post-command-service/**"
      - ".github/workflows/post-command-service-ci.yml"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: post-command-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: post-command-service
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm
          java-version: "25"
          cache: maven
          cache-dependency-path: post-command-service/pom.xml

      - name: Run tests
        run: ./mvnw test -Dspring.profiles.active=test --no-transfer-progress

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/docker-publish.yml
    with:
      image: juangmz7/post-command-service
      context: post-command-service
      dockerfile: post-command-service/Dockerfile
    secrets: inherit
