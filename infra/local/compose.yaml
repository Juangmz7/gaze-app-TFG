# Local development / testing only.
# Backing services (databases, broker, IAM, observability). The microservices
# themselves live in app/compose.yaml and join the same `infra_net` network.
#
# Ports are published on 127.0.0.1 only: Redis and Mongo have no hardening and
# Docker bypasses the host firewall. Drop the prefix to reach them from
# another machine.

# Pinned project name: keeps the existing `infra_*` volumes (and their data)
# now that this file lives in infra/local instead of infra/.
name: infra

services:
  postgres-keycloak:
    image: postgres:16-alpine
    container_name: keycloak_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - infra_net

  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    container_name: keycloak
    restart: unless-stopped

    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}

      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      # Production Hostname (MUST match the actual URL users visit)
      #KC_HOSTNAME: ${KC_HOSTNAME:-https://auth.domain.com}

      # Production Proxy Settings
      # Keycloak requires HTTPS in prod. If you use a reverse proxy (like Nginx),
      # enable these settings to let Keycloak know it is behind a secure proxy.
      #KC_PROXY_HEADERS: xforwarded
      #KC_HTTP_ENABLED: "true"

      # RabbitMQ Event Listener Plugin Config
      # Host and port are the INTERNAL ones (container-to-container). Do not
      # reuse RABBITMQ_PORT here: that variable only controls the port
      # published on the host.
      KK_TO_RMQ_URL: rabbitmq
      KK_TO_RMQ_PORT: 5672
      KK_TO_RMQ_USERNAME: ${RABBITMQ_USER}
      KK_TO_RMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      KK_TO_RMQ_VHOST: /
      KK_TO_RMQ_EXCHANGE: x.auth.events

    ports:
      - "127.0.0.1:${KC_PORT:-8080}:8080"
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import
    depends_on:
      postgres-keycloak:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
    networks:
      - infra_net

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - infra_net

  rabbitmq-init:
    build:
      context: ./rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq_init
    env_file: .env
    # Same as Keycloak: connect over the internal network, regardless of the
    # host-published RABBITMQ_PORT coming from .env.
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: "no"
    networks:
      - infra_net

  grafana-lgtm:
    image: grafana/otel-lgtm:latest
    container_name: grafana-lgtm
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # Grafana UI
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
    networks:
      - infra_net

  # Databases below get a hyphenated network alias: java.net.URI rejects
  # underscores in hostnames (e.g. bolt://social_neo4j:7687), so the
  # containerized apps reach them by alias instead.
  social_postgres:
    image: postgres:16-alpine
    container_name: social_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SOCIAL_POSTGRES_DB:-social_db}
      POSTGRES_USER: ${SOCIAL_POSTGRES_USER:-social_user}
      POSTGRES_PASSWORD: ${SOCIAL_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${SOCIAL_POSTGRES_PORT:-5433}:5432"
    volumes:
      - social_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SOCIAL_POSTGRES_USER:-social_user} -d ${SOCIAL_POSTGRES_DB:-social_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      infra_net:
        aliases: [social-postgres]

  social_neo4j:
    image: neo4j:5-community
    container_name: social_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${SOCIAL_NEO4J_USER:-neo4j}/${SOCIAL_NEO4J_PASSWORD}
    ports:
      - "127.0.0.1:${SOCIAL_NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${SOCIAL_NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - social_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      infra_net:
        aliases: [social-neo4j]

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - infra_net

  post_query_mongo:
    image: mongo:7
    container_name: post_query_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${POST_QUERY_MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${POST_QUERY_MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${POST_QUERY_MONGO_DATABASE:-post_query}
    ports:
      - "127.0.0.1:${POST_QUERY_MONGO_PORT:-27017}:27017"
    volumes:
      - post_query_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      infra_net:
        aliases: [post-query-mongo]

  post_command_postgres:
    image: postgres:16-alpine
    container_name: post_command_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POST_COMMAND_POSTGRES_DB:-post_command_service_db}
      POSTGRES_USER: ${POST_COMMAND_POSTGRES_USER:-post_command_user}
      POSTGRES_PASSWORD: ${POST_COMMAND_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POST_COMMAND_POSTGRES_PORT:-5434}:5432"
    volumes:
      - post_command_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POST_COMMAND_POSTGRES_USER:-post_command_user} -d ${POST_COMMAND_POSTGRES_DB:-post_command_service_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      infra_net:
        aliases: [post-command-postgres]

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: azurite
    restart: unless-stopped
    command: ["azurite", "--blobHost", "0.0.0.0", "--queueHost", "0.0.0.0", "--tableHost", "0.0.0.0", "--location", "/data", "--debug", "/data/debug.log"]
    ports:
      - "127.0.0.1:${AZURITE_BLOB_PORT:-10000}:10000"
      - "127.0.0.1:${AZURITE_QUEUE_PORT:-10001}:10001"
      - "127.0.0.1:${AZURITE_TABLE_PORT:-10002}:10002"
    volumes:
      - azurite_data:/data
    networks:
      - infra_net

  recommendation_postgres:
    # pgvector image: the recommendation-service migrations run
    # CREATE EXTENSION vector, which plain postgres:16-alpine does not ship.
    image: pgvector/pgvector:pg16
    container_name: recommendation_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RECOMMENDATION_POSTGRES_DB:-recommendation_db}
      POSTGRES_USER: ${RECOMMENDATION_POSTGRES_USER:-recommendation_user}
      POSTGRES_PASSWORD: ${RECOMMENDATION_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${RECOMMENDATION_POSTGRES_PORT:-5435}:5432"
    volumes:
      - recommendation_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RECOMMENDATION_POSTGRES_USER:-recommendation_user} -d ${RECOMMENDATION_POSTGRES_DB:-recommendation_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      infra_net:
        aliases: [recommendation-postgres]

volumes:
  keycloak_postgres_data:
  rabbitmq_data:
  post_query_mongo_data:
  social_postgres_data:
  social_neo4j_data:
  redis_data:
  post_command_postgres_data:
  azurite_data:
  recommendation_postgres_data:

networks:
  infra_net:
    # Fixed name so app/compose.yaml can join it as `external` without
    # Compose prefixing it with the project name.
    name: infra_net
    driver: bridge
