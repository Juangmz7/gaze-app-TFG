services:
  postgres-keycloak:
    image: postgres:16-alpine
    container_name: keycloak_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - infra_net

  keycloak:
    build: 
      context: ./keycloak
      dockerfile: Dockerfile
    container_name: keycloak
    restart: unless-stopped
    
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      
      # Production Hostname (MUST match the actual URL users visit)
      #KC_HOSTNAME: ${KC_HOSTNAME:-https://auth.domain.com}
      
      # Production Proxy Settings
      # Keycloak requires HTTPS in prod. If you use a reverse proxy (like Nginx),
      # enable these settings to let Keycloak know it is behind a secure proxy.
      #KC_PROXY_HEADERS: xforwarded
      #KC_HTTP_ENABLED: "true" 
      
      # RabbitMQ Event Listener Plugin Config
      KK_TO_RMQ_URL: ${RABBITMQ_HOST:-rabbitmq}
      KK_TO_RMQ_PORT: ${RABBITMQ_PORT:-5672}
      KK_TO_RMQ_USERNAME: ${RABBITMQ_USER}
      KK_TO_RMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      KK_TO_RMQ_VHOST: /
      KK_TO_RMQ_EXCHANGE: x.auth.events
      
    ports:
      - "${KC_PORT:-8080}:8080"
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import
    depends_on:
      postgres-keycloak:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
    networks:
      - infra_net

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - infra_net

  rabbitmq-init:
    build:
      context: ./rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq_init
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: "no"
    networks:
      - infra_net
  
  grafana-lgtm:
    image: 'grafana/otel-lgtm:latest'
    ports:
      - '3000:3000'
      - '4317:4317'
      - '4318:4318'

  social_postgres:
    image: postgres:16-alpine
    container_name: social_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SOCIAL_POSTGRES_DB:-social_db}
      POSTGRES_USER: ${SOCIAL_POSTGRES_USER:-social_user}
      POSTGRES_PASSWORD: ${SOCIAL_POSTGRES_PASSWORD}
    ports:
      - "${SOCIAL_POSTGRES_PORT:-5433}:5432"
    volumes:
      - social_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SOCIAL_POSTGRES_USER:-social_user} -d ${SOCIAL_POSTGRES_DB:-social_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - infra_net

  social_neo4j:
    image: neo4j:5-community
    container_name: social_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${SOCIAL_NEO4J_USER:-neo4j}/${SOCIAL_NEO4J_PASSWORD}
    ports:
      - "${SOCIAL_NEO4J_HTTP_PORT:-7474}:7474"
      - "${SOCIAL_NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - social_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - infra_net
  
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - infra_net

  post_query_mongo:
    image: mongo:7
    container_name: post_query_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${POST_QUERY_MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${POST_QUERY_MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${POST_QUERY_MONGO_DATABASE:-post_query}
    ports:
      - "${POST_QUERY_MONGO_PORT:-27017}:27017"
    volumes:
      - post_query_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - infra_net

  post_command_postgres:
    image: postgres:16-alpine
    container_name: post_command_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POST_COMMAND_POSTGRES_DB:-post_command_service_db}
      POSTGRES_USER: ${POST_COMMAND_POSTGRES_USER:-post_command_user}
      POSTGRES_PASSWORD: ${POST_COMMAND_POSTGRES_PASSWORD}
    ports:
      - "${POST_COMMAND_POSTGRES_PORT:-5434}:5432"
    volumes:
      - post_command_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POST_COMMAND_POSTGRES_USER:-post_command_user} -d ${POST_COMMAND_POSTGRES_DB:-post_command_service_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - infra_net

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: azurite
    restart: unless-stopped
    command: ["azurite", "--blobHost", "0.0.0.0", "--queueHost", "0.0.0.0", "--tableHost", "0.0.0.0", "--location", "/data", "--debug", "/data/debug.log"]
    ports:
      - "${AZURITE_BLOB_PORT:-10000}:10000"
      - "${AZURITE_QUEUE_PORT:-10001}:10001"
      - "${AZURITE_TABLE_PORT:-10002}:10002"
    volumes:
      - azurite_data:/data
    networks:
      - infra_net

  recommendation_postgres:
    image: postgres:16-alpine
    container_name: recommendation_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RECOMMENDATION_POSTGRES_DB:-recommendation_db}
      POSTGRES_USER: ${RECOMMENDATION_POSTGRES_USER:-recommendation_user}
      POSTGRES_PASSWORD: ${RECOMMENDATION_POSTGRES_PASSWORD}
    ports:
      - "${RECOMMENDATION_POSTGRES_PORT:-5435}:5432"
    volumes:
      - recommendation_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RECOMMENDATION_POSTGRES_USER:-recommendation_user} -d ${RECOMMENDATION_POSTGRES_DB:-recommendation_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - infra_net

volumes:
  keycloak_postgres_data:
  rabbitmq_data:
  post_query_mongo_data:
  social_postgres_data:
  social_neo4j_data:
  redis_data:
  post_command_postgres_data:
  azurite_data:
  recommendation_postgres_data:

networks:
  infra_net:
    driver: bridge