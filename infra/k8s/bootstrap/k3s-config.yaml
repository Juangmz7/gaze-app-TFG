# k3s server configuration for the local single-node cluster (WSL2 Ubuntu).
# bootstrap.sh installs it as /etc/rancher/k3s/config.yaml before installing
# k3s (pinned in bootstrap.sh).
#
# - Traefik is disabled: ingress is Envoy Gateway (Gateway API).
# - ServiceLB (klipper-lb) stays enabled: it exposes the Gateway's
#   LoadBalancer Service on the node's ports 80/443.
# - NetworkPolicies are enforced by k3s' embedded network policy controller.
# - cluster-cidr is fixed: the node's pod CIDR is 10.42.0.0/24, so its
#   pod-network gateway (10.42.0.1) is how pods reach the databases on the
#   host (infra/k8s/platform/external-databases).

node-name: gaze
write-kubeconfig-mode: "0600"
cluster-cidr: 10.42.0.0/16
service-cidr: 10.43.0.0/16
disable:
  - traefik
# Encrypt Secrets at rest in the datastore.
secrets-encryption: true
