apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ .Values.gatewayName }}-proxy
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: {{ .Values.proxy.replicas }}
        container:
          resources:
            {{- toYaml .Values.proxy.resources | nindent 12 }}
      envoyService:
        type: LoadBalancer
        externalTrafficPolicy: {{ .Values.proxy.externalTrafficPolicy }}
      {{- if gt (int .Values.proxy.pdbMinAvailable) 0 }}
      envoyPDB:
        minAvailable: {{ .Values.proxy.pdbMinAvailable }}
      {{- end }}
  {{- $t := .Values.telemetry }}
  {{- if $t.enabled }}
  {{- $c := $t.collector }}
  # Edge spans, Envoy metrics and access logs over OTLP gRPC to the collector
  # (-> Tempo / Mimir / Loki). host/port are deprecated in favour of
  # backendRefs but still supported; see values.yaml (telemetry.collector).
  telemetry:
    {{- if $t.tracing.enabled }}
    tracing:
      samplingRate: {{ int $t.tracing.samplingRate }}
      provider:
        type: OpenTelemetry
        host: {{ $c.host }}
        port: {{ int $c.port }}
        serviceName: {{ $t.serviceName | quote }}
        openTelemetry:
          resourceAttributes:
            deployment.environment.name: {{ .Values.environment | quote }}
    {{- end }}
    {{- if $t.metrics.enabled }}
    metrics:
      sinks:
        - type: OpenTelemetry
          openTelemetry:
            host: {{ $c.host }}
            port: {{ int $c.port }}
            resourceAttributes:
              {{- include "gateway.otlpResourceAttributes" . | nindent 14 }}
    {{- end }}
    {{- if $t.accessLog.otel.enabled }}
    accessLog:
      settings:
        {{- if $t.accessLog.stdout }}
        # No format: Envoy Gateway's default JSON access log, as before.
        - sinks:
            - type: File
              file:
                path: /dev/stdout
        {{- end }}
        # No format type: text is the OTLP log body, json its attributes.
        - format:
            text: {{ $t.accessLog.otel.text | quote }}
            json:
              {{- toYaml $t.accessLog.otel.attributes | nindent 14 }}
          sinks:
            - type: OpenTelemetry
              openTelemetry:
                host: {{ $c.host }}
                port: {{ int $c.port }}
                resourceAttributes:
                  {{- include "gateway.otlpResourceAttributes" . | nindent 18 }}
    {{- else if not $t.accessLog.stdout }}
    accessLog:
      disable: true
    {{- end }}
  {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gatewayName }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
  annotations:
    # cert-manager issues {{ .Values.tls.secretName }} for every HTTPS listener hostname.
    cert-manager.io/cluster-issuer: {{ .Values.tls.clusterIssuer }}
spec:
  gatewayClassName: {{ .Values.gatewayClassName }}
  # Proxies of this Gateway run in this namespace (Gateway Namespace Mode),
  # configured by the EnvoyProxy above.
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: {{ .Values.gatewayName }}-proxy
  listeners:
    # Plain HTTP only redirects to HTTPS (and serves ACME HTTP-01 challenges).
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-api
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.hostnames.api }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.tls.secretName }}
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        # Only this environment's service namespaces may attach routes.
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gaze.app/env: {{ .Values.environment }}
              gaze.app/tier: app
    - name: https-auth
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.hostnames.auth }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.tls.secretName }}
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gaze.app/env: {{ .Values.environment }}
              gaze.app/tier: identity
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gatewayName }}
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
