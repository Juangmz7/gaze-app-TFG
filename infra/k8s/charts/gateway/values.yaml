# Overridden per environment in infra/k8s/environments/<env>/gateway.yaml.

environment: dev

gatewayName: gaze
gatewayClassName: envoy-gateway

hostnames:
  api: api.dev.gaze.localhost
  auth: auth.dev.gaze.localhost

tls:
  # cert-manager ClusterIssuer that signs the listener certificate.
  clusterIssuer: gaze-local-ca
  secretName: gaze-tls

# Envoy proxy fleet (EnvoyProxy resource).
proxy:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  # Local keeps the client source IP (needed for per-IP rate limiting).
  externalTrafficPolicy: Local
  pdbMinAvailable: 0

# Gateway-wide BackendTrafficPolicy: applies to every route that does not
# override it.
trafficPolicy:
  # Requests per client IP (each IP has its own bucket).
  rateLimit:
    requests: 600
    unit: Minute
  # Per backend: shed load instead of queueing when a service is saturated.
  circuitBreaker:
    maxConnections: 1024
    maxPendingRequests: 256
    maxParallelRequests: 1024
    maxParallelRetries: 16
  # Outlier detection: eject pods that keep failing.
  passiveHealthCheck:
    consecutive5XxErrors: 5
    consecutiveGatewayErrors: 3
    interval: 5s
    baseEjectionTime: 30s
    maxEjectionPercent: 50
  # Only retry when the request never reached the app (safe for POST).
  retry:
    numRetries: 2
    triggers: [connect-failure, refused-stream]
  timeout:
    connectTimeout: 5s
    requestTimeout: 30s

# Behind a CDN / L7 load balancer that sets X-Forwarded-For, set this to the
# number of trusted hops so rate limiting sees the real client IP.
clientIPDetection:
  xForwardedForTrustedHops: 0

# Envoy proxy telemetry (EnvoyProxy spec.telemetry), pushed over OTLP gRPC to
# the shared collector, which forwards to LGTM (Tempo / Mimir / Loki).
# enabled: false drops every OTLP export and the collector egress rule, and
# leaves Envoy's default stdout access log.
telemetry:
  enabled: true
  collector:
    # Service of the OpenTelemetryCollector "gaze" (platform/observability).
    # Set as host/port, not backendRefs: a backendRef to a Service in another
    # namespace would also need a ReferenceGrant in observability.
    host: gaze-collector.observability.svc.cluster.local
    # OTLP gRPC (Envoy's OTLP exporters only speak gRPC).
    port: 4317
    # Where the collector pods run, for the egress NetworkPolicy.
    namespace: observability
    podLabels:
      app.kubernetes.io/component: opentelemetry-collector
  # service.name of the edge spans, metrics and access logs. Every resource
  # also gets deployment.environment.name=<environment>, like the services.
  serviceName: gaze-gateway
  tracing:
    enabled: true
    # Percentage (0-100) of requests that start a trace when the client did
    # not send a sampling decision (traceparent). The decision propagates to
    # the services, so the edge span is the root of the trace.
    samplingRate: 10
  metrics:
    enabled: true
  accessLog:
    # Keep Envoy Gateway's default JSON access log on stdout (kubectl logs).
    stdout: true
    # Also ship access logs to Loki through the collector.
    otel:
      enabled: true
      # Log line (OTLP body).
      text: >-
        [%START_TIME%] "%REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% %PROTOCOL%"
        %RESPONSE_CODE% %RESPONSE_FLAGS% %BYTES_RECEIVED% %BYTES_SENT% %DURATION%
        "%REQ(:AUTHORITY)%" "%UPSTREAM_HOST%" "%REQ(X-REQUEST-ID)%"
      # OTLP log attributes (structured metadata in Loki). trace_id links
      # each access log to its edge span in Tempo.
      attributes:
        trace_id: "%TRACE_ID%"
        start_time: "%START_TIME%"
        method: "%REQ(:METHOD)%"
        path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
        protocol: "%PROTOCOL%"
        authority: "%REQ(:AUTHORITY)%"
        response_code: "%RESPONSE_CODE%"
        response_flags: "%RESPONSE_FLAGS%"
        response_code_details: "%RESPONSE_CODE_DETAILS%"
        bytes_received: "%BYTES_RECEIVED%"
        bytes_sent: "%BYTES_SENT%"
        duration: "%DURATION%"
        upstream_service_time: "%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%"
        upstream_host: "%UPSTREAM_HOST%"
        upstream_cluster: "%UPSTREAM_CLUSTER%"
        route_name: "%ROUTE_NAME%"
        x_forwarded_for: "%REQ(X-FORWARDED-FOR)%"
        user_agent: "%REQ(USER-AGENT)%"
        x_request_id: "%REQ(X-REQUEST-ID)%"
        downstream_remote_address: "%DOWNSTREAM_REMOTE_ADDRESS%"

networkPolicy:
  # Namespaces of the Envoy Gateway control plane (xDS 18000, rate limit
  # service 8081).
  controlPlaneNamespace: envoy-gateway-system
  # Container ports of the backends the proxies may reach.
  backendPorts: [8080, 8081, 8082]
