# Default values for the microservice chart.
# Every service overrides them in infra/k8s/services/<service>/values.yaml
# (shared) and values-<env>.yaml (per environment).

nameOverride: ""
fullnameOverride: ""

# Deployment environment (dev | prod). Added as the gaze.app/env label.
environment: dev

image:
  # Docker Hub repository, e.g. docker.io/juangmz7/social-service
  repository: ""
  # Tracked tag. Argo CD Image Updater (digest strategy) overrides it with
  # latest@sha256:<digest> on every push, which rolls the Deployment.
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Ignored while autoscaling.enabled: KEDA owns the replica count.
replicaCount: 1

# Overrides the image ENTRYPOINT / CMD when set.
command: []
args: []

# Container port serving the HTTP API and the health probes.
containerPort: 8080

service:
  # A ClusterIP Service is needed for gateway routing; workers without HTTP
  # routes can disable it (probes still hit the container port).
  enabled: true
  port: 80

probes:
  liveness:
    path: /healthz/live
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /healthz/ready
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  # Guards slow starts (JVM, ML model load) so liveness does not kill the pod
  # while it boots: failureThreshold * periodSeconds = max boot time.
  startup:
    path: /healthz/live
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 36

# Non-sensitive environment variables, rendered into a ConfigMap.
env: {}

# Sensitive environment variables, rendered into a Secret.
# Only for local development values; real environments set existingSecret
# instead (created by External Secrets / Vault with the same keys).
secretEnv: {}

# Name of a pre-existing Secret to load instead of rendering secretEnv.
existingSecret: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop: ["ALL"]

# emptyDir mounts for paths the app must write to, since the root
# filesystem is read-only.
writableDirs:
  - /tmp

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # Workloads never call the Kubernetes API.
  automountToken: false

podLabels: {}
podAnnotations: {}

# Must exceed the app's graceful shutdown (Spring: 30s per phase).
terminationGracePeriodSeconds: 45

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 0

# Spread replicas across nodes; ScheduleAnyway keeps single-node k3s working.
topologySpread:
  enabled: true
  whenUnsatisfiable: ScheduleAnyway

nodeSelector: {}
tolerations: []
affinity: {}

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# KEDA ScaledObject. Every queue becomes a rabbitmq trigger; KEDA scales on
# the highest demand across triggers.
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  pollingInterval: 15
  cooldownPeriod: 120
  rabbitmq:
    # Key, in the service Secret, holding the amqp:// URI KEDA connects with.
    hostSecretKey: RABBITMQ_AMQP_URI
    vhost: /
    queues: []
    #  - name: q.example.queue
    #    # Messages per replica before scaling out.
    #    value: "20"
    #    activationValue: "0"
  # Optional CPU trigger (needs resources.requests.cpu).
  cpu:
    enabled: false
    utilization: "75"
  # HPA behavior: scale up fast, scale down slowly to avoid flapping.
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 4
          periodSeconds: 30

# Gateway API HTTPRoute attached to the environment Gateway.
httpRoute:
  enabled: false
  parentRef:
    name: gaze
    namespace: gateway-dev
    sectionName: https-api
  hostnames: []
  # Each entry is a PathPrefix match routed to this service.
  pathPrefixes: []
  # Request timeout for the whole upstream response.
  timeout: 30s

networkPolicy:
  enabled: true
  # Namespace of the Envoy proxies allowed to reach containerPort. Only used
  # when httpRoute.enabled.
  gatewayNamespace: gateway-dev
  # In-cluster dependencies this service may connect to.
  egress: []
  #  - name: rabbitmq
  #    namespace: rabbitmq-dev
  #    podLabels:
  #      app.kubernetes.io/component: rabbitmq
  #    ports: [5672]
  # Out-of-cluster dependencies (databases, cloud APIs) by CIDR.
  externalEgress: []
  #  - name: postgres
  #    cidr: 10.42.0.1/32
  #    except: []
  #    ports: [5433]

# Database migrations run as a Helm pre-install/pre-upgrade hook, which Argo
# CD maps to a PreSync hook: the new pods only roll out after it succeeds.
migrations:
  enabled: false
  command: []
  args: []
  backoffLimit: 3
  activeDeadlineSeconds: 600
