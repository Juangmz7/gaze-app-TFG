{{- /*
Only the paths clients need are public (Keycloak "exposed path
recommendations"): /realms (OIDC endpoints, login pages) and /resources
(static assets). /admin is routed only when exposeAdminConsole is true;
/health and /metrics live on the management port and are never routed.
*/}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.sectionName }}
  hostnames:
    - {{ .Values.hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /realms/
        - path:
            type: PathPrefix
            value: /resources/
        {{- if .Values.exposeAdminConsole }}
        - path:
            type: PathPrefix
            value: /admin/
        {{- end }}
      backendRefs:
        # Service created by the Keycloak Operator.
        - kind: Service
          name: keycloak-service
          port: 8080
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: keycloak
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: keycloak
  # Keep the Gateway-wide circuit breaking/retries, override the rate limit.
  mergeType: StrategicMerge
  rateLimit:
    global:
      rules:
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: 0.0.0.0/0
          limit:
            requests: {{ .Values.rateLimit.requests }}
            unit: {{ .Values.rateLimit.unit }}
          shared: false
