# Envoy Gateway controller (+ Gateway API CRDs). Per-environment Gateways
# live in infra/k8s/charts/gateway.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
spec:
  project: platform
  source:
    repoURL: docker.io/envoyproxy
    chart: gateway-helm
    targetRevision: v1.9.3
    helm:
      releaseName: eg
      valuesObject:
        config:
          envoyGateway:
            provider:
              type: Kubernetes
              kubernetes:
                # Proxies run in each Gateway's namespace (gateway-<env>),
                # so every environment's edge is isolated in its own network.
                deploy:
                  type: GatewayNamespace
            # Global (cluster-wide) rate limiting, needed for per-IP limits
            # shared by all proxy replicas.
            rateLimit:
              backend:
                type: Redis
                redis:
                  url: ratelimit-redis.envoy-gateway-system.svc.cluster.local:6379
        deployment:
          envoyGateway:
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Gateway API CRDs exceed the client-side apply annotation size limit.
      - ServerSideApply=true
