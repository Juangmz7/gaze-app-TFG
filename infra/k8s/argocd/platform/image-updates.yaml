# What Argo CD Image Updater tracks (after the apps it updates exist).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: image-updates
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: platform
  source:
    repoURL: https://github.com/Juangmz7/gaze-app-TFG.git
    targetRevision: main
    path: infra/k8s/platform/image-updates
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
