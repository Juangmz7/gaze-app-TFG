# Per-node telemetry agent (pod logs + kubelet metrics) -> the shared
# collector in observability. Its own namespace because it needs the
# "privileged" Pod Security level (hostPath /var/log/pods), which the
# observability namespace must not get.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-agent
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: platform
  source:
    repoURL: https://github.com/Juangmz7/gaze-app-TFG.git
    targetRevision: main
    path: infra/k8s/platform/observability-agent
  destination:
    server: https://kubernetes.default.svc
    namespace: observability-agent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        gaze.app/tier: observability
        pod-security.kubernetes.io/enforce: privileged
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
