# Keycloak Operator CRDs + shared ClusterRoles (the operator itself runs per
# environment, see infra/k8s/charts/keycloak).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
spec:
  project: platform
  source:
    repoURL: https://github.com/Juangmz7/Gaze-app.git
    targetRevision: main
    path: infra/k8s/platform/keycloak-operator
  # Only cluster-scoped resources; the namespace is just the project's target.
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
