# In-cluster names for the databases outside the cluster (no pods: only
# selector-less Services + EndpointSlices pointing at the k3s host).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-databases
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: platform
  source:
    repoURL: https://github.com/Juangmz7/gaze-app-TFG.git
    targetRevision: main
    path: infra/k8s/platform/external-databases
  destination:
    server: https://kubernetes.default.svc
    namespace: external-databases
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        gaze.app/tier: external-databases
        pod-security.kubernetes.io/enforce: restricted
    syncOptions:
      - CreateNamespace=true
