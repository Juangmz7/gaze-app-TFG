# RabbitMQ Cluster + Messaging Topology operators (namespace rabbitmq-system,
# created by the upstream manifest).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rabbitmq-operators
  namespace: argocd
  annotations:
    # After cert-manager: the topology operator's webhook needs a certificate.
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: platform
  source:
    repoURL: https://github.com/Juangmz7/Gaze-app.git
    targetRevision: main
    path: infra/k8s/platform/rabbitmq-operators
  destination:
    server: https://kubernetes.default.svc
    namespace: rabbitmq-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
