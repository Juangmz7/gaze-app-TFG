# cert-manager: Gateway TLS certificates and the webhook certificates of the
# Messaging Topology and OpenTelemetry operators.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    # After envoy-gateway: the Gateway API CRDs must exist when cert-manager starts.
    argocd.argoproj.io/sync-wave: "-7"
spec:
  project: platform
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.3
    helm:
      releaseName: cert-manager
      valuesObject:
        global:
          # Leader election leases in its own namespace instead of kube-system
          # (the chart's default), so the app stays within its namespace.
          leaderElection:
            namespace: cert-manager
        crds:
          enabled: true
          keep: true
        config:
          apiVersion: controller.config.cert-manager.io/v1alpha1
          kind: ControllerConfiguration
          gatewayAPI:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
