# Per-environment infrastructure: one Application per component x env, each
# in its own namespace (<component>-<env>) so every layer is a separate,
# default-deny network.
#   chart:  infra/k8s/charts/<component>
#   values: infra/k8s/environments/<env>/<component>.yaml
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: env-infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - component: gateway
                  tier: edge
                  podSecurity: baseline
                - component: rabbitmq
                  tier: messaging
                  podSecurity: baseline
                - component: redis
                  tier: cache
                  podSecurity: restricted
                - component: keycloak
                  tier: identity
                  podSecurity: baseline
          - list:
              elements:
                - env: dev
                  enabled: "true"
                # TODO(aks): enable once prod runs on AKS with its managed
                # databases and Vault-backed secrets.
                - env: prod
                  enabled: "false"
      selector:
        matchLabels:
          enabled: "true"
  # Argo CD Image Updater writes the Keycloak image digest as a Helm parameter.
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/source/helm/parameters
  template:
    metadata:
      name: "{{ .component }}-{{ .env }}"
      labels:
        gaze.app/env: "{{ .env }}"
        gaze.app/tier: "{{ .tier }}"
    spec:
      project: env-infra
      source:
        repoURL: https://github.com/Juangmz7/Gaze-app.git
        targetRevision: main
        path: "infra/k8s/charts/{{ .component }}"
        helm:
          releaseName: "{{ .component }}"
          valueFiles:
            - "../../environments/{{ .env }}/{{ .component }}.yaml"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .component }}-{{ .env }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            gaze.app/env: "{{ .env }}"
            gaze.app/tier: "{{ .tier }}"
            pod-security.kubernetes.io/enforce: "{{ .podSecurity }}"
            pod-security.kubernetes.io/warn: restricted
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
