# One Application per service x env, all from the generic chart. Adding a
# service = adding infra/k8s/services/<service>/values{,-dev,-prod}.yaml.
#   chart:  infra/k8s/charts/microservice
#   values: infra/k8s/services/<service>/values.yaml + values-<env>.yaml
#   ns:     <service>-<env>
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: microservices
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/Juangmz7/gaze-app-TFG.git
              revision: main
              directories:
                - path: infra/k8s/services/*
          - list:
              elements:
                - env: dev
                  enabled: "true"
                # TODO(aks): enable once prod runs on AKS with its managed
                # databases and Vault-backed secrets.
                - env: prod
                  enabled: "false"
      selector:
        matchLabels:
          enabled: "true"
  # Argo CD Image Updater writes image.tag=latest@sha256:<digest> as a Helm
  # parameter; without this the ApplicationSet would revert it.
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/source/helm/parameters
  template:
    metadata:
      name: "{{ .path.basename }}-{{ .env }}"
      labels:
        gaze.app/env: "{{ .env }}"
        gaze.app/tier: app
    spec:
      project: apps
      source:
        repoURL: https://github.com/Juangmz7/gaze-app-TFG.git
        targetRevision: main
        path: infra/k8s/charts/microservice
        helm:
          releaseName: "{{ .path.basename }}"
          valueFiles:
            - "../../services/{{ .path.basename }}/values.yaml"
            - "../../services/{{ .path.basename }}/values-{{ .env }}.yaml"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .path.basename }}-{{ .env }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            gaze.app/env: "{{ .env }}"
            gaze.app/tier: app
            gaze.app/service: "{{ .path.basename }}"
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/warn: restricted
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
