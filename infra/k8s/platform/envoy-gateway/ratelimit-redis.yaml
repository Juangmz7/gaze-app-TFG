# Backend of Envoy Gateway's global rate limit service (per-IP counters
# shared by every proxy replica). Dedicated instance: the application Redis
# stays isolated from the edge. Counters are ephemeral, so no persistence.
apiVersion: v1
kind: Service
metadata:
  name: ratelimit-redis
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/name: ratelimit-redis
    app.kubernetes.io/part-of: gaze
spec:
  selector:
    app.kubernetes.io/name: ratelimit-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ratelimit-redis
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/name: ratelimit-redis
    app.kubernetes.io/part-of: gaze
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ratelimit-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ratelimit-redis
        app.kubernetes.io/part-of: gaze
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4.11-alpine
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - name: redis
              containerPort: 6379
          livenessProbe:
            tcpSocket:
              port: redis
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
# Only Envoy Gateway's components (the rate limit service) may reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ratelimit-redis
  namespace: envoy-gateway-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ratelimit-redis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 6379
