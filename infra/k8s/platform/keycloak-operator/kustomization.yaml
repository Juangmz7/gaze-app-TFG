# Cluster-scoped part of the Keycloak Operator (must match the Keycloak
# version, 25.0.6): CRDs and the ClusterRoles the per-environment operators
# bind to. The operator itself is deployed per environment by
# infra/k8s/charts/keycloak.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources/25.0.6/kubernetes/keycloaks.k8s.keycloak.org-v1.yml
  - https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources/25.0.6/kubernetes/keycloakrealmimports.k8s.keycloak.org-v1.yml
  - cluster-roles.yaml
