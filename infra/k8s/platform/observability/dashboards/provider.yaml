# Grafana dashboard provider for the Gaze dashboards (folder "Gaze"). Mounted
# next to the image's own provider (RED / JVM dashboards) in
# /otel-lgtm/grafana/conf/provisioning/dashboards/. The JSON files are
# mounted from ConfigMaps into /otel-lgtm/gaze-dashboards and re-read every
# 30 s, so a dashboard change is live without restarting LGTM.
# allowUiUpdates is off: dashboards cannot be saved from the UI; change the
# JSON in git (or regenerate it) instead.
apiVersion: 1
providers:
  - name: gaze
    folder: Gaze
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /otel-lgtm/gaze-dashboards
      foldersFromFilesStructure: false
