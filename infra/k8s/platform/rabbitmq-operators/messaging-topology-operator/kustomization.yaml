# Messaging Topology Operator (admission webhook certificate from cert-manager).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/rabbitmq/messaging-topology-operator/releases/download/v1.20.4/messaging-topology-operator-with-certmanager.yaml
patches:
  # Both upstream manifests declare the rabbitmq-system Namespace; keep the
  # cluster operator's, or kustomize rejects the duplicate.
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: rabbitmq-system
