# RabbitMQ Cluster Operator + Messaging Topology Operator (the latter's
# admission webhook certificate comes from cert-manager). Both install into
# rabbitmq-system and watch every namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/rabbitmq/cluster-operator/releases/download/v2.23.1/cluster-operator.yml
  - https://github.com/rabbitmq/messaging-topology-operator/releases/download/v1.20.4/messaging-topology-operator-with-certmanager.yaml
