# Databases that live OUTSIDE the cluster, published as stable in-cluster
# names: <db>.external-databases.svc.cluster.local:<standard port>.
#
# Local k3s (single node on WSL2): the infra/local compose stack runs on the
# same host with DB_BIND_IP=0.0.0.0, so every database is reachable from pods
# at the node's pod-network gateway, 10.42.0.1 (first IP of the node's pod
# CIDR, cluster-cidr 10.42.0.0/16 in bootstrap/k3s-config.yaml), on its
# published port (infra/local/.env). The services' NetworkPolicies allow
# egress to exactly 10.42.0.1/32 on those ports.
#
# AKS: the prod values address the managed databases by their own hostnames,
# so this layer is not used there.
---
# social-service: host port 5433
apiVersion: v1
kind: Service
metadata:
  name: social-postgres
  namespace: external-databases
  labels:
    app.kubernetes.io/name: social-postgres
    app.kubernetes.io/part-of: gaze
spec:
  # No selector: endpoints come from the EndpointSlice below.
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: social-postgres-host
  namespace: external-databases
  labels:
    kubernetes.io/service-name: social-postgres
    endpointslice.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: gaze
addressType: IPv4
ports:
  - name: postgres
    port: 5433
    protocol: TCP
endpoints:
  - addresses: ["10.42.0.1"]
    conditions:
      ready: true
---
