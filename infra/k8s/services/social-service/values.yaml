# social-service: values shared by every environment.
# Chart: infra/k8s/charts/microservice. Per-env overrides: values-<env>.yaml.

image:
  repository: docker.io/juangmz7/social-service

# application-dev.yaml and application-prod.yaml both set server.port=8081
containerPort: 8081

probes:
  liveness:
    path: /actuator/health/liveness
  readiness:
    path: /actuator/health/readiness
  startup:
    path: /actuator/health/liveness

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi

env:
  SPRING_APPLICATION_NAME: social-service
  # Heap sized from the container memory limit; crash fast on OOM so the
  # pod restarts instead of limping.
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"

httpRoute:
  enabled: true
  pathPrefixes:
    - /api/social

autoscaling:
  enabled: true
  rabbitmq:
    # Queues it consumes (social-service/src/main/resources/application.yaml).
    # value = ready messages per replica before scaling out: low where a user
    # waits for the result, higher where the work is background bookkeeping.
    queues:
      # Sign-up from Keycloak and its Neo4j copy: the profile and graph node
      # must exist before the new user's first request or follow.
      - name: q.social-service.auth.register
        value: "20"
      - name: q.social-service.user.register
        value: "20"
      - name: q.social-service.auth.update
        value: "50"
      # Follower / post counters and block lists shown on profiles.
      - name: q.social-service.user.follow.created
        value: "100"
      - name: q.social-service.user.follow.deleted
        value: "100"
      - name: q.social-service.user.block.created
        value: "100"
      - name: q.social-service.post.created
        value: "100"
      - name: q.social-service.post.deleted
        value: "100"
      # Account deletion cleanup: nobody waits on it.
      - name: q.social-service.auth.delete
        value: "300"
      - name: q.social-service.user.deleted
        value: "300"
  cpu:
    enabled: true
    utilization: "75"
