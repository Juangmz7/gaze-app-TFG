# post-query-service: values shared by every environment.
# Chart: infra/k8s/charts/microservice. Per-env overrides: values-<env>.yaml.

image:
  repository: docker.io/juangmz7/post-query-service

containerPort: 8080

probes:
  liveness:
    path: /healthz/live
  readiness:
    path: /healthz/ready
  startup:
    path: /healthz/live
    failureThreshold: 12

# Static Go binary: small footprint.
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 256Mi

env:
  HTTP_PORT: "8080"
  POST_QUERY_MONGO_DATABASE: post_query
  # Audience required of every token. JWKS_URL and JWT_ISSUER are per environment.
  JWT_AUDIENCE: account
  FEED_DEFAULT_PAGE_SIZE: "15"
  FEED_MAX_PAGE_SIZE: "15"
  FEED_MAX_READS_PER_CLAIM: "3"
  FEED_RETENTION_HOURS: "168"
  FEED_DISCONNECT_WRITE_TIMEOUT_MS: "5000"
  # Asynchronous prefetch. The instance id is the pod's hostname.
  FEED_PREFETCH_MAX_UNSERVED: "60"
  FEED_PREFETCH_EXCLUDED_IDS_CAP: "200"
  FEED_PREFETCH_TIMEOUT_MS: "5000"
  # Must exceed queue time plus pipeline time; the pipeline is not measured yet.
  FEED_LEASE_TTL_MS: "300000"
  FEED_LEASE_RELEASE_TIMEOUT_MS: "5000"
  FEED_LOW_WATERMARK_CONCURRENCY: "16"
  FEED_SWEEP_INTERVAL_MS: "60000"
  FEED_SWEEP_STALE_AFTER_MS: "180000"
  FEED_SWEEP_BATCH_SIZE: "100"

httpRoute:
  enabled: true
  pathPrefixes:
    - /api/feed

autoscaling:
  enabled: true
  rabbitmq:
    # Queues it consumes (internal/shared/infrastructure/rabbitmq/topology).
    # value = ready messages per replica before scaling out: low where a user
    # waits for the result, higher where the work is background bookkeeping.
    queues:
      # Post / comment / like / share / collab read models: a new post or
      # comment only shows up once it is projected.
      - name: q.post-query-service.post
        value: "50"
      # New and updated users, follows and blocks (what the feed filters on).
      - name: q.post-query-service.user.fast
        value: "50"
      # Recommended feeds (and trending signals) from recommendation-service.
      - name: q.post-query-service.feed
        value: "200"
      # Deletions, unfollows and unblocks, latency-tolerant by design.
      - name: q.post-query-service.user.slow
        value: "300"
  cpu:
    enabled: true
    utilization: "75"
