# post-query-service: prod environment.
# Hosts marked CHANGE_ME are provisioned with the AKS migration.

environment: prod

env:
  RABBITMQ_HOST: rabbitmq.rabbitmq-prod.svc.cluster.local
  RABBITMQ_PORT: "5672"

# Created by External Secrets from Vault. Required keys:
#   POST_QUERY_MONGO_URI (mongodb+srv://user:pass@CHANGE_ME/post_query?...),
#   RABBITMQ_USER, RABBITMQ_PASSWORD,
#   RABBITMQ_AMQP_URI (amqp://user:pass@rabbitmq.rabbitmq-prod.svc.cluster.local:5672/, for KEDA)
existingSecret: post-query-service

resources:
  requests:
    cpu: 200m
    memory: 128Mi
  limits:
    memory: 512Mi

httpRoute:
  parentRef:
    namespace: gateway-prod
  hostnames:
    - api.gaze.localhost

autoscaling:
  minReplicas: 2
  maxReplicas: 10

networkPolicy:
  gatewayNamespace: gateway-prod
  egress:
    - name: rabbitmq
      namespace: rabbitmq-prod
      podLabels:
        app.kubernetes.io/component: rabbitmq
      ports: [5672]
  externalEgress:
    # TODO(aks): narrow to the private endpoint of the managed database.
    - name: mongodb
      cidr: 10.0.0.0/8
      ports: [27017]
