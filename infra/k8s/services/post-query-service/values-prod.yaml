# post-query-service: prod environment.
# Hosts marked CHANGE_ME are provisioned with the AKS migration.

environment: prod

env:
  RABBITMQ_HOST: rabbitmq.rabbitmq-prod.svc.cluster.local
  RABBITMQ_PORT: "5672"
  # Keycloak: tokens carry the public issuer; keys are fetched in-cluster.
  JWT_ISSUER: https://auth.gaze.localhost/realms/auth-service
  JWKS_URL: http://keycloak-service.keycloak-prod.svc.cluster.local:8080/realms/auth-service/protocol/openid-connect/certs
  # Headless Service: one address per pod, balanced per call with round_robin.
  RECOMMENDATION_GRPC_ADDR: dns:///recommendation-service.recommendation-service-prod.svc.cluster.local:50051

# Created by External Secrets from Vault. Required keys:
#   POST_QUERY_MONGO_URI (mongodb+srv://user:pass@CHANGE_ME/post_query?...),
#   RABBITMQ_USER, RABBITMQ_PASSWORD,
#   RABBITMQ_AMQP_URI (amqp://user:pass@rabbitmq.rabbitmq-prod.svc.cluster.local:5672/, for KEDA)
existingSecret: post-query-service

resources:
  requests:
    cpu: 200m
    memory: 128Mi
  limits:
    memory: 512Mi

httpRoute:
  parentRef:
    namespace: gateway-prod
  hostnames:
    - api.gaze.localhost

autoscaling:
  minReplicas: 2
  maxReplicas: 10

networkPolicy:
  gatewayNamespace: gateway-prod
  egress:
    - name: rabbitmq
      namespace: rabbitmq-prod
      podLabels:
        app.kubernetes.io/component: rabbitmq
      ports: [5672]
    - name: keycloak (JWKS)
      namespace: keycloak-prod
      podLabels:
        app.kubernetes.io/managed-by: keycloak-operator
      ports: [8080]
    - name: recommendation-service (gRPC)
      namespace: recommendation-service-prod
      podLabels:
        app.kubernetes.io/name: recommendation-service
      ports: [50051]
  externalEgress:
    # TODO(aks): narrow to the private endpoint of the managed database.
    - name: mongodb
      cidr: 10.0.0.0/8
      ports: [27017]
