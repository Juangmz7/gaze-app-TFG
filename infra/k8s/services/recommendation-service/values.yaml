# recommendation-service: values shared by every environment.
# Chart: infra/k8s/charts/microservice. Per-env overrides: values-<env>.yaml.
# FastStream worker that consumes RabbitMQ and serves /healthz, plus the gRPC
# server post-query-service calls when a user runs out of feed.

image:
  repository: docker.io/juangmz7/recommendation-service

# Start only the worker; migrations run in the pre-sync Job below instead of
# the image CMD, so several replicas never migrate concurrently.
command:
  - opentelemetry-instrument
  - faststream
  - run
  - rabbitmq.config.connection:app
  - --host
  - 0.0.0.0
  - --port
  - "8000"

containerPort: 8000

# No HTTP route; probes hit the container port directly. The Service exists for
# gRPC. Headless: post-query-service balances per call with dns:/// + round_robin
# on recommendation-service.recommendation-service-<env>.svc.cluster.local:50051.
service:
  enabled: true
  headless: true

grpc:
  enabled: true
  port: 50051

probes:
  liveness:
    path: /healthz/live
  readiness:
    path: /healthz/ready
  # Loading the embedding model on CPU is slow: allow up to 5 minutes.
  startup:
    path: /healthz/live
    periodSeconds: 10
    failureThreshold: 30

# Qwen3-Embedding-0.6B on CPU.
resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    memory: 3Gi

env:
  MODEL_DEVICE: cpu
  OTEL_SERVICE_NAME: recommendation-service
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  # Export Python logs over OTLP and inject trace/span IDs into the records.
  OTEL_PYTHON_LOG_CORRELATION: "true"
  # Root log level, read at startup (src/observability/logging_config.py).
  LOG_LEVEL: INFO
  # The model is baked into the image (HF_HOME): never call the Hub at runtime.
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  # Read-only root filesystem: caches and bytecode go to the /tmp emptyDir.
  HOME: /tmp
  PYTHONDONTWRITEBYTECODE: "1"
  # Level of this service's loggers (default INFO). Libraries stay at WARNING.
  LOG_LEVEL: INFO
  GRPC_PORT: "50051"
  # Pipeline runs at once in a replica, over gRPC and RabbitMQ together. Feed
  # requests take FEED_CONSUMER_PREFETCH of them, so gRPC keeps a worker.
  PIPELINE_WORKER_POOL_SIZE: "2"
  FEED_CONSUMER_PREFETCH: "1"

migrations:
  enabled: true
  command: ["alembic", "upgrade", "head"]

autoscaling:
  enabled: true
  rabbitmq:
    # Queues it consumes (src/rabbitmq/config/constants.py). The post and user
    # queues feed the recommendation features asynchronously and each replica is
    # heavy (it loads the embedding model), so they tolerate a large backlog. The
    # feed queue has a user behind every message and takes one at a time per
    # replica, so it scales out early.
    queues:
      - name: q.recommendation-service.feed
        value: "5"
      - name: q.recommendation-service.post
        value: "200"
      - name: q.recommendation-service.user
        value: "200"
  # This service answers gRPC requests too, which no queue depth shows.
  cpu:
    enabled: true
    utilization: "70"
