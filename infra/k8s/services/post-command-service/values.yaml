# post-command-service: values shared by every environment.
# Chart: infra/k8s/charts/microservice. Per-env overrides: values-<env>.yaml.

image:
  repository: docker.io/juangmz7/post-command-service

# application-dev.yaml and application-prod.yaml both set server.port=8082
containerPort: 8082

probes:
  liveness:
    path: /actuator/health/liveness
  readiness:
    path: /actuator/health/readiness
  startup:
    path: /actuator/health/liveness

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi

env:
  SPRING_APPLICATION_NAME: post-command-service
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"

httpRoute:
  enabled: true
  pathPrefixes:
    - /api/posts
    - /api/collabs

autoscaling:
  enabled: true
  rabbitmq:
    # Queues it consumes (post-command-service/src/main/resources/application.yaml).
    # value = ready messages per replica before scaling out: low where a user
    # waits for the result, higher where the work is background bookkeeping.
    queues:
      # Like / unlike / share / comment-like validations and view processing:
      # the user's action is confirmed when they are handled.
      - name: q.post-command-service.post
        value: "20"
      # User read model: new and updated users, follows and blocks.
      - name: q.post-command-service.user.fast
        value: "50"
      # User read model: deletions, unfollows and unblocks, latency-tolerant.
      - name: q.post-command-service.user.slow
        value: "300"
  cpu:
    enabled: true
    utilization: "75"
