# Test Profile — social-service
# Activate with: --spring.profiles.active=test
spring:
  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true

# --- Logging ---
logging:
  level:
    root: INFO
    com.app.socialservice: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: TRACE
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.amqp: DEBUG
    org.neo4j.driver: DEBUG
    org.springframework.data.neo4j: DEBUG

# --- OpenTelemetry ---
management:
  tracing:
    export:
      enabled: false

# --- RabbitMQ Bindings ---
rabbitmq:
  queue:
    auth:
      register: q.social-service.auth.register
      update: q.social-service.auth.update
      delete: q.social-service.auth.delete
    user:
      register: q.social-service.user.register
      deleted: q.social-service.user.deleted
  exchange:
    auth:
      events: x.auth.events
    user:
      events: x.user.events
  rk:
    auth:
      user:
        register: "KK.EVENT.CLIENT.auth-service.SUCCESS.*.REGISTER"
        update: "KK.EVENT.CLIENT.auth-service.SUCCESS.*.UPDATE"
        delete: "KK.EVENT.CLIENT.auth-service.SUCCESS.*.DELETE"
    user:
      updated: rk.user.updated
      deleted: rk.user.deleted
      register:
        created: rk.user.registered
      follow:
        created: rk.user.follow.created
        deleted: rk.user.followed.deleted
      block:
        created: rk.user.block.created
        deleted: rk.user.block.deleted