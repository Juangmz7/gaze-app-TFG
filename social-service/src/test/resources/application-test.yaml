# Test Profile — social-service
# Activate with: --spring.profiles.active=test
spring:
  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true

# --- Logging ---
logging:
  level:
    root: INFO
    com.app.socialservice: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: TRACE
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.amqp: DEBUG
    org.neo4j.driver: DEBUG
    org.springframework.data.neo4j: DEBUG

# --- OpenTelemetry ---
management:
  tracing:
    export:
      enabled: false

# --- Azure Blob Storage ---
# account-url is overridden by the Azurite container of TestcontainersConfiguration. This
# fallback lets contexts without Azurite (e.g. RabbitTracePropagationIntegrationTest) start:
# building the Blob beans makes no network call.
azure:
  storage:
    account-url: http://127.0.0.1:10000/devstoreaccount1
    container: post-media-test
    upload-sas-ttl: PT15M
    read-sas-window: PT24H
    use-account-key: true
    # Azurite's well-known default emulator key (local emulator only, never a real secret).
    account-key: Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
