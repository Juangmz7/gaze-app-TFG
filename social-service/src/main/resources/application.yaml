# --- Application identity (also the default OpenTelemetry service.name) ---
spring:
  application:
    name: social-service
  # --- RabbitMQ publisher confirms (required by the outbox relay) ---
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    # Bounds each connection attempt (default 60 s): keeps relay cycles and the
    # immediate send on the HTTP thread short, well under the outbox lock timeout.
    connection-timeout: 5s

# --- Outbox relay ---
outbox:
  relay:
    fixed-delay-ms: 40000
  cleanup:
    cron: "0 0 3 * * *"

# --- RabbitMQ Bindings ---
rabbitmq:
  queue:
    auth:
      register: q.social-service.auth.register
      update: q.social-service.auth.update
      delete: q.social-service.auth.delete
    user:
      register: q.social-service.user.register
      deleted: q.social-service.user.deleted
      follow:
        created: q.social-service.user.follow.created
        deleted: q.social-service.user.follow.deleted
      block:
        created: q.social-service.user.block.created
    post:
      created: q.social-service.post.created
      deleted: q.social-service.post.deleted
  exchange:
    auth:
      events: x.auth.events
    user:
      events: x.user.events
    post:
      events: x.post.events
  rk:
    auth:
      user:
        register: "KK.EVENT.CLIENT.auth-service.SUCCESS.*.REGISTER"
        update: "KK.EVENT.CLIENT.auth-service.SUCCESS.*.UPDATE"
        delete: "KK.EVENT.CLIENT.auth-service.SUCCESS.*.DELETE"
    user:
      updated: rk.user.updated
      deleted: rk.user.deleted
      register:
        created: rk.user.registered
      follow:
        created: rk.user.follow.created
        deleted: rk.user.follow.deleted
      block:
        created: rk.user.block.created
        deleted: rk.user.block.deleted
    post:
      created: rk.post.created
      deleted: rk.post.deleted

# --- Actuator (Kubernetes probes: /actuator/health/liveness and /readiness) ---
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  # Histogram buckets, so that Grafana can compute p50/p95/p99. Without them a
  # timer only exports its count and sum. The expected range bounds how many
  # buckets each series gets.
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        hikaricp.connections.acquire: true
        hikaricp.connections.usage: true
        spring.rabbit.listener: true
        spring.data.repository.invocations: true
        jvm.gc.pause: true
      minimum-expected-value:
        http.server.requests: 1ms
        hikaricp.connections.acquire: 1ms
        hikaricp.connections.usage: 1ms
        spring.rabbit.listener: 1ms
        spring.data.repository.invocations: 1ms
        jvm.gc.pause: 1ms
      maximum-expected-value:
        http.server.requests: 30s
        hikaricp.connections.acquire: 30s
        hikaricp.connections.usage: 60s
        spring.rabbit.listener: 120s
        spring.data.repository.invocations: 30s
        jvm.gc.pause: 10s
