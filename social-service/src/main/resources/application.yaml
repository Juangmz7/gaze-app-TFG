# Production Configuration — social-service
spring:
  application:
    name: social-service

  # --- Virtual Threads ---
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # --- PostgreSQL Datasource (HikariCP) ---
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: social-service-hikari-pool
      maximum-pool-size: 20
      minimum-idle: 20
      connection-timeout: 5000
      validation-timeout: 10000
      max-lifetime: 120000
      idle-timeout: 100
      auto-commit: false

  # --- JPA / Hibernate ---
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false
        jdbc:
          batch_size: 25
          batch_versioned_data: true
          time_zone: UTC
        order_inserts: true
        order_updates: true

  # --- Neo4j ---
  neo4j:
    uri: ${NEO4J_URI}
    authentication:
      username: ${NEO4J_USER}
      password: ${NEO4J_PASSWORD}
    pool:
      max-connection-pool-size: 20
      connection-acquisition-timeout: 5000
      max-connection-lifetime: 120000

  # --- RabbitMQ ---
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: /

  # --- OAuth2 Resource Server (downloads Keycloak JWKS to validate tokens) ---
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

# --- Server ---
server:
  port: 8081
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/plain
    min-response-size: 1024

# --- Logging ---
logging:
  level:
    root: INFO
    com.app.socialservice: INFO
    org.springframework: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

# --- OpenTelemetry (OTLP HTTP export) ---
management:
  opentelemetry:
    resource-attributes:
      "service.name": social-service
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/logs
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/metrics
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:0.1}

# --- Resilience4J ---
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state:
          seconds: 10
        permitted-number-of-calls-in-half-open-state: 3

# --- RabbitMQ Bindings ---
rabbitmq:
  queue:
    auth:
      register: q.social-service.auth.register
      update: q.social-service.auth.update
      delete: q.social-service.auth.delete
    user:
      register: q.social-service.user.register
      deleted: q.social-service.user.deleted
  exchange:
    auth:
      events: x.auth.events
    user:
      events: x.user.events
  rk:
    auth:
      user:
        register: "KK.EVENT.CLIENT.auth-service.SUCCESS.*.REGISTER"
        update: "KK.EVENT.CLIENT.auth-service.SUCCESS.*.UPDATE"
        delete: "KK.EVENT.CLIENT.auth-service.SUCCESS.*.DELETE"
    user:
      updated: rk.user.updated
      deleted: rk.user.deleted
      register:
        created: rk.user.registered
      follow:
        created: rk.user.follow.created
        deleted: rk.user.followed.deleted
      block:
        created: rk.user.block.created
        deleted: rk.user.block.deleted

