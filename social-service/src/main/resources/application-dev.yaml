# Development Profile — social-service
# Activate with: --spring.profiles.active=dev
spring:
  # --- PostgreSQL ---
  datasource:
    url: jdbc:postgresql://localhost:5432/social_service_db
    username: social_user
    password: social_pass
    hikari:
      pool-name: social-service-hikari-pool-dev

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true

  # --- Neo4j ---
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: neo4j_dev_pass

  # --- RabbitMQ ---
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  # --- Keycloak  ---
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/auth-service

# --- Logging (verbose for debugging) ---
logging:
  level:
    root: INFO
    com.app.socialservice: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: TRACE
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.amqp: DEBUG
    org.neo4j.driver: DEBUG
    org.springframework.data.neo4j: DEBUG
    io.opentelemetry: DEBUG

# --- OpenTelemetry (local Grafana LGTM stack) ---
management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  tracing:
    sampling:
      probability: 1.0

# --- RabbitMQ Bindings ---
rabbitmq:
  queue:
    auth:
      register: q.social-service.auth.register
    user:
      register: q.social-service.user.register
  exchange:
    auth:
      events: x.auth.events
    user:
      events: x.user.events
  rk:
    auth:
      user:
        register: "KK.EVENT.CLIENT.auth-service.SUCCESS.*.REGISTER"
    user:
      updated: rk.user.updated
      deleted: rk.user.deleted
      register:
        created: rk.user.registered
      follow:
        created: rk.user.follow.created
        deleted: rk.user.followed.deleted
      block:
        created: rk.user.block.created
        deleted: rk.user.block.deleted

