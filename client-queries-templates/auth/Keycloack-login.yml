info:
  name: Keycloack-login
  type: http
  seq: 1

http:
  method: GET
  url: ""
  auth:
    type: oauth2
    flow: authorization_code
    authorizationUrl: https://auth.dev.gaze.localhost/realms/auth-service/protocol/openid-connect/auth
    accessTokenUrl: https://auth.dev.gaze.localhost/realms/auth-service/protocol/openid-connect/token
    callbackUrl: https://oauth.pstmn.io/v1/callback
    credentials:
      clientId: mobile-app
      placement: body
    scope: openid
    pkce: {}
    tokenConfig:
      id: credentials
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
