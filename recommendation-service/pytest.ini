[pytest]
# test/ is on the path so shared helpers import as _support.*: the folder itself
# cannot be imported as "test", which always resolves to the standard library's
# package (namespace packages, i.e. folders without __init__.py, never win)
pythonpath = src test
testpaths = test
asyncio_mode = auto
markers =
    unit: isolated unit tests
    integration: tests requiring PostgreSQL/Testcontainers infrastructure
addopts = --strict-markers
