# Alembic configuration file for the recommendation-service.
# DATABASE_URL is read from the environment variable in alembic/env.py.
# See: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migration scripts (relative to the location of this file)
script_location = alembic

# sqlalchemy.url is intentionally blank; env.py reads DATABASE_URL from the
# environment so that no credentials are hard-coded here.
sqlalchemy.url =

# File name template used when generating new revision files
file_template = %%(rev)s_%%(slug)s

prepend_sys_path = %(here)s/src

[post_write_hooks]

[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
